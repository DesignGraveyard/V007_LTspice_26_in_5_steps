<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Generator | The Design Graveyard</title>
  
  <!-- Favicon / Tab Icon -->
  <link rel="icon" type="image/png" href="https://ico.bytecook.io/png/conduit.png" />

  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #18181b;
      --panel-bg: #27272a;
      --yellow: #facc15;
      --yellow-hover: #eab308;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #3f3f46;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border: 2px solid var(--yellow);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Channel Header */
    .channel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .channel-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .channel-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .channel-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--yellow);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .channel-link {
      color: var(--yellow);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      background: rgba(250, 204, 21, 0.1);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--yellow);
      transition: all 0.2s ease;
    }

    .channel-link:hover {
      background: var(--yellow);
      color: #000;
    }

    /* Top Canvas Display */
    canvas {
      width: 100%;
      height: 200px;
      background: #000000;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: block;
    }

    /* Controls Grid */
    .panels-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    @media (max-width: 600px) {
      .panels-grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .panel-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    /* Waveform Buttons */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
    }

    .btn-wave {
      background: #18181b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-wave:hover {
      border-color: var(--yellow);
    }

    .btn-wave.active {
      background: var(--yellow);
      color: #000;
      border-color: var(--yellow);
    }

    /* Sliders & Display Readouts */
    .val-display {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--yellow);
      margin-bottom: 0.25rem;
    }

    input[type="range"] {
      accent-color: var(--yellow);
      cursor: pointer;
      width: 100%;
    }

    /* Master Play/Stop Button */
    .toggle-btn {
      background: var(--yellow);
      color: #000;
      border: none;
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background 0.2s ease;
    }

    .toggle-btn:hover {
      background: var(--yellow-hover);
    }

    .toggle-btn.playing {
      background: #ef4444;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Channel Branding Header -->
    <div class="channel-header">
      <div class="channel-brand">
        <img src="https://ico.bytecook.io/png/conduit.png" alt="Conduit Icon" class="channel-icon" />
        <span class="channel-title">The Design Graveyard</span>
      </div>
      <a href="https://www.youtube.com/@TheDesignGraveyard" target="_blank" class="channel-link">Visit Channel ➔</a>
    </div>

    <!-- Top Display Canvas -->
    <canvas id="waveformCanvas"></canvas>

    <!-- Bottom Controls -->
    <div class="panels-grid">
      <!-- Waveform Selection -->
      <div class="panel">
        <span class="panel-title">1. Waveform</span>
        <div class="btn-group">
          <button class="btn-wave active" data-wave="sine">Sine</button>
          <button class="btn-wave" data-wave="square">Square</button>
          <button class="btn-wave" data-wave="sawtooth">Saw</button>
          <button class="btn-wave" data-wave="triangle">Triangle</button>
        </div>
      </div>

      <!-- Frequency Control (Logarithmic 20 Hz to 20 kHz) -->
      <div class="panel">
        <span class="panel-title">2. Frequency</span>
        <div class="val-display"><span id="freqVal">1.0 k</span>Hz</div>
        <input type="range" id="freqSlider" min="0" max="1" step="0.001" value="0.5">
      </div>

      <!-- Amplitude Control -->
      <div class="panel">
        <span class="panel-title">3. Amplitude</span>
        <div class="val-display"><span id="gainVal">50</span>%</div>
        <input type="range" id="gainSlider" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>

    <button id="toggleBtn" class="toggle-btn">Start Signal</button>
  </div>

  <script>
    // Constants for 20 Hz to 20 kHz Logarithmic Scaling
    const MIN_FREQ = 20;
    const MAX_FREQ = 20000;

    let currentWave = 'sine';
    let currentFreq = 1000;
    let displayCycles = 3;
    let currentGain = 0.5;
    let isPlaying = false;

    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;

    const canvas = document.getElementById('waveformCanvas');
    const canvasCtx = canvas.getContext('2d');
    const waveButtons = document.querySelectorAll('.btn-wave');
    const freqSlider = document.getElementById('freqSlider');
    const freqVal = document.getElementById('freqVal');
    const gainSlider = document.getElementById('gainSlider');
    const gainVal = document.getElementById('gainVal');
    const toggleBtn = document.getElementById('toggleBtn');

    function sliderToFreq(val) {
      const minLog = Math.log10(MIN_FREQ);
      const maxLog = Math.log10(MAX_FREQ);
      return Math.round(Math.pow(10, minLog + val * (maxLog - minLog)));
    }

    function setupCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      canvasCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
      drawStaticWaveform();
    }
    window.addEventListener('resize', setupCanvas);

    function drawStaticWaveform() {
      const width = canvas.width / window.devicePixelRatio;
      const height = canvas.height / window.devicePixelRatio;
      const centerY = height / 2;
      const maxAmplitude = (height / 2) * 0.8 * currentGain;

      canvasCtx.fillStyle = '#000000';
      canvasCtx.fillRect(0, 0, width, height);

      canvasCtx.strokeStyle = '#27272a';
      canvasCtx.lineWidth = 1;
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, centerY);
      canvasCtx.lineTo(width, centerY);
      canvasCtx.stroke();

      canvasCtx.strokeStyle = '#facc15';
      canvasCtx.lineWidth = 2.5;
      canvasCtx.beginPath();

      for (let x = 0; x < width; x++) {
        const t = (x / width) * (Math.PI * 2 * displayCycles);
        let sample = 0;

        switch (currentWave) {
          case 'sine':
            sample = Math.sin(t);
            break;
          case 'square':
            sample = Math.sin(t) >= 0 ? 1 : -1;
            break;
          case 'sawtooth':
            sample = 2 * ((t / (Math.PI * 2)) - Math.floor(0.5 + (t / (Math.PI * 2))));
            break;
          case 'triangle':
            sample = 2 * Math.abs(2 * ((t / (Math.PI * 2)) - Math.floor(0.5 + (t / (Math.PI * 2))))) - 1;
            break;
        }

        const y = centerY - (sample * maxAmplitude);

        if (x === 0) canvasCtx.moveTo(x, y);
        else canvasCtx.lineTo(x, y);
      }

      canvasCtx.stroke();
    }

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      oscillator = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();

      oscillator.type = currentWave;
      oscillator.frequency.value = currentFreq;
      gainNode.gain.value = currentGain;

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.start();
    }

    waveButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        waveButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentWave = btn.getAttribute('data-wave');
        if (oscillator) oscillator.type = currentWave;
        drawStaticWaveform();
      });
    });

    freqSlider.addEventListener('input', (e) => {
      const sliderPos = parseFloat(e.target.value);
      currentFreq = sliderToFreq(sliderPos);

      if (currentFreq >= 1000) {
        freqVal.textContent = (currentFreq / 1000).toFixed(currentFreq >= 10000 ? 0 : 1) + ' k';
      } else {
        freqVal.textContent = currentFreq + ' ';
      }

      if (oscillator) {
        oscillator.frequency.setValueAtTime(currentFreq, audioCtx.currentTime);
      }
      drawStaticWaveform();
    });

    gainSlider.addEventListener('input', (e) => {
      currentGain = parseFloat(e.target.value);
      gainVal.textContent = Math.round(currentGain * 100);

      if (gainNode) {
        gainNode.gain.setValueAtTime(currentGain, audioCtx.currentTime);
      }
      drawStaticWaveform();
    });

    toggleBtn.addEventListener('click', () => {
      if (!isPlaying) {
        if (!audioCtx) initAudio();
        else if (audioCtx.state === 'suspended') audioCtx.resume();
        isPlaying = true;
        toggleBtn.textContent = 'Stop Signal';
        toggleBtn.classList.add('playing');
      } else {
        if (audioCtx) audioCtx.suspend();
        isPlaying = false;
        toggleBtn.textContent = 'Start Signal';
        toggleBtn.classList.remove('playing');
      }
    });

    currentFreq = sliderToFreq(parseFloat(freqSlider.value));
    setupCanvas();
  </script>
</body>
</html>
